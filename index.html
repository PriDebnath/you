<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="Anthor" content="Pritam Debnath" />
  <meta name="LinkedIn" content="https://www.linkedin.com/in/pritam-debnath-762019239/" />
  <meta name="GitHub" content="https://github.com/PriDebnath" />
  
  <title>It's you</title>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      width: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.js"></script>
  <script>
    // Images
    let yourImage = "./images/you.jpg";
    let bgImage = "./images/space.jpg";
    let textureImage = "./images/texture.jpg";
    // Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector("#canvas"),
    });
    
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.position.z = 20;
    
    // Lights
    const pointLight = new THREE.PointLight("red");
    pointLight.position.set(115, 115, 15);
    const ambientLight = new THREE.AmbientLight("white");
    scene.add(pointLight, ambientLight);
    
    // Background
    const spaceTexture = new THREE.TextureLoader().load(bgImage);
    scene.background = spaceTexture;
    
    //--------
    
    // stars
    let instancedStars;
    let starVel = [];
    let starPhase = [];
    let dummy = new THREE.Object3D();
    const starCount = 1000;
    
    makeStars() // ✨
    
    // Moon
    const moonTexture = new THREE.TextureLoader().load(yourImage);
    const normalTexture = new THREE.TextureLoader().load(textureImage);
    const you = new THREE.Mesh(
      new THREE.SphereGeometry(3, 32, 32),
      new THREE.MeshStandardMaterial({
        map: moonTexture,
        normalMap: normalTexture,
      })
    );
    scene.add(you);
    you.position.z = -10;
    
    // **Swipe and Drag Interaction**
    let touchStartX = 0;
    let touchStartY = 0;
    let lastTouchX = 0;
    let lastTouchY = 0;
    let rotationVelocityX = 0;
    let rotationVelocityY = 0;
    const momentumDecay = 0.998;
    let interactingWithMoon = false;
    
    function handleInteractionStart(clientX, clientY) {
      touchStartX = clientX;
      touchStartY = clientY;
      lastTouchX = touchStartX;
      lastTouchY = touchStartY;
      
      const interactionPosition = new THREE.Vector3(
        (touchStartX / window.innerWidth) * 2 - 1,
        -(touchStartY / window.innerHeight) * 2 + 1,
        0.5
      );
      interactionPosition.unproject(camera);
      
      const raycaster = new THREE.Raycaster(
        camera.position,
        interactionPosition.sub(camera.position).normalize()
      );
      const intersects = raycaster.intersectObject(you);
      interactingWithMoon = intersects.length > 0;
    }
    
    function handleInteractionMove(clientX, clientY) {
      const dx = clientX - lastTouchX;
      const dy = clientY - lastTouchY;
      
      if (interactingWithMoon) {
        // Rotate moon
        you.rotation.y += dx * 0.005;
        you.rotation.x += dy * 0.005;
        rotationVelocityX = dx * 0.001;
        rotationVelocityY = dy * 0.001;
      } else {
        // Move camera view
        camera.position.applyMatrix4(
          new THREE.Matrix4().makeRotationY(dx * 0.005)
        );
        camera.position.applyMatrix4(
          new THREE.Matrix4().makeRotationX(dy * 0.005)
        );
        camera.lookAt(you.position);
      }
      
      lastTouchX = clientX;
      lastTouchY = clientY;
    }
    
    function handleInteractionEnd() {
      if (interactingWithMoon) {
        function applyMomentum() {
          you.rotation.y += rotationVelocityX;
          you.rotation.x += rotationVelocityY;
          rotationVelocityX *= momentumDecay;
          rotationVelocityY *= momentumDecay;
          
          if (
            Math.abs(rotationVelocityX) > 0.001 ||
            Math.abs(rotationVelocityY) > 0.001
          ) {
            requestAnimationFrame(applyMomentum);
          }
        }
        
        applyMomentum();
      }
    }
    
    // **New: Touch Event Handlers**
    document.addEventListener(
      "touchstart",
      (event) => {
        if (event.touches.length === 1) {
          handleInteractionStart(
            event.touches[0].clientX,
            event.touches[0].clientY
          );
        }
      },
      false
    );
    
    document.addEventListener(
      "touchmove",
      (event) => {
        if (event.touches.length === 1) {
          handleInteractionMove(
            event.touches[0].clientX,
            event.touches[0].clientY
          );
        }
      },
      false
    );
    
    document.addEventListener("touchend", handleInteractionEnd, false);
    
    // **New: Mouse Event Handlers**
    document.addEventListener(
      "mousedown",
      (event) => {
        handleInteractionStart(event.clientX, event.clientY);
      },
      false
    );
    
    document.addEventListener(
      "mousemove",
      (event) => {
        if (event.buttons === 1) {
          // Check if left mouse button is pressed
          handleInteractionMove(event.clientX, event.clientY);
        }
      },
      false
    );
    
    document.addEventListener("mouseup", handleInteractionEnd, false);
    
    // Animation Loop
    function animate() {
      
      animateStars()
      requestAnimationFrame(animate);
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    
    setInterval(() => {
      let currentX = lastTouchX + 1
      let currentY = lastTouchY + 1
      handleInteractionMove(currentX, currentY)
    }, 100)
    
    
    
    ///helpers start
    
    
    function makeStars() {
      const starGeometry = new THREE.SphereGeometry(0.5, 16, 16);
      
      // --- Add per-instance brightness attribute ---
      const brightness = new Float32Array(starCount);
      for (let i = 0; i < starCount; i++) {
        brightness[i] = Math.random(); // 0–1 initial brightness
      }
      starGeometry.setAttribute(
        "brightness",
        new THREE.InstancedBufferAttribute(brightness, 1)
      );
      
      // --- Custom shader material ---
      const starMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          color: { value: new THREE.Color("#C9FDFF") }
        },
        vertexShader: `
      attribute float brightness;
      varying float vBrightness;
      void main() {
        vBrightness = brightness;
        gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform vec3 color;
      varying float vBrightness;
      void main() {
        gl_FragColor = vec4(color * vBrightness, vBrightness);
      }
    `
      });
      
      instancedStars = new THREE.InstancedMesh(
        starGeometry,
        starMaterial,
        starCount
      );
      scene.add(instancedStars);
      
      dummy = new THREE.Object3D();
      
      for (let i = 0; i < starCount; i++) {
        const x = THREE.MathUtils.randFloatSpread(200);
        const y = THREE.MathUtils.randFloatSpread(200);
        const z = THREE.MathUtils.randFloatSpread(200);
        
        dummy.position.set(x, y, z);
        dummy.updateMatrix();
        instancedStars.setMatrixAt(i, dummy.matrix);
        
        starVel[i] = new THREE.Vector3(
          THREE.MathUtils.randFloat(-0.006, 0.002),
          THREE.MathUtils.randFloat(-0.006, 0.002),
          THREE.MathUtils.randFloat(-0.006, 0.002)
        );
        
        starPhase[i] = Math.random() * Math.PI * 2;
      }
    }
    
    function animateStars() {
      // --- STAR ANIMATION ---
      const brightnessAttr = instancedStars.geometry.getAttribute("brightness");
      
      for (let i = 0; i < starCount; i++) {
        
        // Get matrix
        instancedStars.getMatrixAt(i, dummy.matrix);
        dummy.position.setFromMatrixPosition(dummy.matrix);
        
        // Movement
        dummy.position.add(starVel[i]);
        
        if (dummy.position.length() > 200) {
          dummy.position.set(
            THREE.MathUtils.randFloatSpread(200),
            THREE.MathUtils.randFloatSpread(200),
            THREE.MathUtils.randFloatSpread(200)
          );
        }
        
        // Realistic brightness twinkle
        brightnessAttr.array[i] =
          0.6 + Math.sin(starPhase[i]) * 0.4; // stays between 0.2–1
        
        starPhase[i] += 0.03;
        
        dummy.updateMatrix();
        instancedStars.setMatrixAt(i, dummy.matrix);
      }
      
      brightnessAttr.needsUpdate = true;
      instancedStars.instanceMatrix.needsUpdate = true;
      
    }
  </script>
</body>

</html>
